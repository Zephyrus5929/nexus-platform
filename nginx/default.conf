server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index nexus.html;

    # Nexus landing
    location = / {
        try_files /nexus.html =404;
    }

    # Static pages and assets
    location / {
        try_files $uri $uri/ =404;
    }

    # Finance chatbot widget
    location /widget/ {
        alias /usr/share/nginx/html/widget/;
    }

    # Auth API (same-origin for browser login)
    location /api/auth/ {
        proxy_pass http://auth:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/me {
        proxy_pass http://auth:8000/me;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # Chatbot API — portfolio data and chat messages
    location /api/portfolio {
        proxy_pass http://chatbot:3001/api/portfolio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/chat {
        proxy_pass http://chatbot:3001/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
}
