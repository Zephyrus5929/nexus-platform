<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Chatbot Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

    /* ─── Design tokens ──────────────────────────────────── */
    :root {
      --green:        #1D9E75;
      --green-light:  #E1F5EE;
      --green-dark:   #085041;
      --green-mid:    #5DCAA5;
      --amber:        #BA7517;
      --amber-light:  #FAEEDA;
      --red:          #E24B4A;
      --red-light:    #FCEBEB;
      --surface:      #ffffff;
      --surface-2:    #f8f9fb;
      --border:       rgba(0,0,0,0.09);
      --border-dark:  rgba(0,0,0,0.14);
      --text:         #1a1a1a;
      --text-muted:   #6b7280;
      --text-hint:    #9ca3af;
      --radius:       14px;
      --radius-sm:    8px;
    }

    /* ─── Widget shell ───────────────────────────────────── */
    .widget {
      display: flex;
      flex-direction: column;
      width: 420px;
      height: 680px;
      border-radius: var(--radius);
      border: 1px solid var(--border-dark);
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 12px 48px rgba(0,0,0,0.12);
    }

    /* ─── Header ─────────────────────────────────────────── */
    .header {
      background: var(--green-dark);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .header-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--green);
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; flex-shrink: 0;
    }
    .header-info { flex: 1; }
    .header-name { color: #fff; font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .header-status { font-size: 11px; color: #9FE1CB; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-mid); flex-shrink: 0; }
    .verified-badge {
      background: rgba(255,255,255,0.15); color: #9FE1CB;
      font-size: 10px; font-weight: 500; padding: 2px 7px;
      border-radius: 20px; display: inline-flex; align-items: center; gap: 3px;
    }
    .header-btn {
      width: 30px; height: 30px; border-radius: 7px;
      background: rgba(255,255,255,0.1); border: none; cursor: pointer;
      color: #9FE1CB; font-size: 15px; transition: background 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .header-btn:hover { background: rgba(255,255,255,0.2); }

    /* ─── Portfolio bar ──────────────────────────────────── */
    .portfolio-bar {
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      padding: 10px 0;
      display: flex;
      flex-shrink: 0;
    }
    .port-stat { flex: 1; text-align: center; padding: 0 8px; }
    .port-stat + .port-stat { border-left: 1px solid var(--border); }
    .port-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 3px; }
    .port-value { font-size: 15px; font-weight: 500; font-family: 'DM Mono', monospace; color: var(--text); }
    .port-change { font-size: 11px; font-weight: 500; margin-top: 1px; }
    .up   { color: var(--green); }
    .down { color: var(--red); }
    .neutral { color: var(--text-muted); }

    /* ─── Messages ───────────────────────────────────────── */
    .messages {
      flex: 1; overflow-y: auto; padding: 14px 14px 8px;
      display: flex; flex-direction: column; gap: 10px;
      scrollbar-width: thin; scrollbar-color: var(--border-dark) transparent;
    }
    .msg { display: flex; gap: 8px; align-items: flex-end; max-width: 92%; }
    .msg.user  { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot   { align-self: flex-start; }
    .msg-avatar {
      width: 27px; height: 27px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .bot  .msg-avatar { background: var(--green-light); }
    .user .msg-avatar { background: #dbeafe; color: #1e40af; font-size: 11px; font-weight: 500; }
    .msg-bubble {
      padding: 9px 13px; border-radius: 14px;
      font-size: 13px; line-height: 1.55;
    }
    .bot  .msg-bubble { background: var(--surface-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: var(--text); }
    .user .msg-bubble { background: var(--green-dark); color: #fff; border-bottom-right-radius: 4px; }
    .msg-bubble strong { font-weight: 600; }
    .msg-time { font-size: 10px; color: var(--text-hint); margin-top: 3px; }
    .bot  .msg-time { text-align: left; }
    .user .msg-time { text-align: right; }

    /* ─── Card bubble (holdings, transactions) ───────────── */
    .card-bubble {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      margin-top: 6px;
      font-size: 12px;
    }
    .card-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .card-row:last-child { border-bottom: none; padding-bottom: 0; }
    .card-ticker { font-family: 'DM Mono', monospace; font-weight: 500; font-size: 12px; color: var(--text); }
    .card-name   { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .card-price  { font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; color: var(--text); }

    /* ─── Typing indicator ───────────────────────────────── */
    .typing-indicator { display: flex; align-items: center; gap: 4px; padding: 10px 13px; }
    .typing-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted); animation: bounce 1.2s ease-in-out infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30%            { transform: translateY(-5px); opacity: 1; }
    }

    /* ─── Quick replies ──────────────────────────────────── */
    .quick-replies { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 14px 4px; flex-shrink: 0; }
    .qr-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px; padding: 5px 11px;
      border-radius: 20px;
      border: 1px solid var(--border-dark);
      background: var(--surface-2);
      color: var(--text-muted);
      cursor: pointer; transition: all 0.15s;
      white-space: nowrap;
    }
    .qr-btn:hover { background: var(--green-light); border-color: var(--green); color: var(--green-dark); }
    .qr-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ─── Input row ──────────────────────────────────────── */
    .input-row {
      padding: 10px 12px 14px;
      display: flex; gap: 8px; align-items: center;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1; border: 1px solid var(--border-dark);
      background: var(--surface-2); border-radius: 20px;
      padding: 8px 14px; font-family: 'DM Sans', sans-serif;
      font-size: 13px; color: var(--text); outline: none;
      transition: border-color 0.15s;
    }
    .chat-input:focus { border-color: var(--green); }
    .chat-input::placeholder { color: var(--text-hint); }
    .send-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--green); border: none; cursor: pointer;
      color: white; font-size: 16px; flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
      display: flex; align-items: center; justify-content: center;
    }
    .send-btn:hover  { background: var(--green-dark); }
    .send-btn:active { transform: scale(0.93); }

    /* ─── Error toast ────────────────────────────────────── */
    .toast {
      position: absolute; bottom: 72px; left: 50%; transform: translateX(-50%);
      background: var(--red-light); color: #7f1d1d; border: 1px solid var(--red);
      border-radius: var(--radius-sm); padding: 6px 14px; font-size: 12px;
      white-space: nowrap; pointer-events: none; opacity: 0;
      transition: opacity 0.2s;
    }
    .toast.visible { opacity: 1; }
    .widget-wrap { position: relative; }
  </style>
</head>
<body>

<div class="widget-wrap">
  <div class="widget" role="main">

    <!-- Header -->
    <header class="header">
      <div class="header-avatar" aria-hidden="true">💹</div>
      <div class="header-info">
        <div class="header-name">
          FinAssist
          <span class="verified-badge" id="authBadge">● Verified</span>
        </div>
        <div class="header-status">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Connecting…</span>
        </div>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="header-btn" onclick="refreshPortfolio()" title="Refresh portfolio data">↻</button>
        <button class="header-btn" onclick="toggleInfo()" title="About this widget">ℹ</button>
      </div>
    </header>

    <!-- Portfolio bar (data injected by JS after auth) -->
    <div class="portfolio-bar" id="portfolioBar" role="region" aria-label="Portfolio summary">
      <div class="port-stat">
        <div class="port-label">Portfolio</div>
        <div class="port-value" id="pTotal">–</div>
        <div class="port-change neutral" id="pReturn">Loading…</div>
      </div>
      <div class="port-stat">
        <div class="port-label">Today P&L</div>
        <div class="port-value" id="pPnl">–</div>
        <div class="port-change neutral" id="pPnlLabel">Today</div>
      </div>
      <div class="port-stat">
        <div class="port-label">Cash</div>
        <div class="port-value" id="pCash">–</div>
        <div class="port-change neutral">Available</div>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Chat messages"></div>

    <!-- Quick replies -->
    <div class="quick-replies" id="quickReplies" role="group" aria-label="Suggested questions">
      <button class="qr-btn" onclick="sendQuick(this,'Analyze my risk exposure')">Risk analysis</button>
      <button class="qr-btn" onclick="sendQuick(this,'Show rebalancing suggestions')">Rebalancing</button>
      <button class="qr-btn" onclick="sendQuick(this,'Recent transactions')">Transactions</button>
      <button class="qr-btn" onclick="sendQuick(this,'Tax loss harvesting tips')">Tax tips</button>
      <button class="qr-btn" onclick="sendQuick(this,'Performance vs S&P 500')">Benchmark</button>
    </div>

    <!-- Input -->
    <div class="input-row">
      <input class="chat-input" id="chatInput" type="text"
             placeholder="Ask about your portfolio…" aria-label="Type your message" />
      <button class="send-btn" id="sendBtn" onclick="handleSend()" aria-label="Send message">➤</button>
    </div>

  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ================================================================
   CONFIGURATION — update these for your environment
   ================================================================ */
const _params = new URLSearchParams(window.location.search);
const CONFIG = {
  apiBase: window.CHATBOT_API_BASE || 'http://localhost:3001',
  authBase: window.AUTH_API_BASE || window.location.origin,
  chatEndpoint: '/api/chat',
  portfolioEndpoint: '/api/portfolio',
  meEndpoint: '/api/me',
  loginPage: '/login.html',
  demoMode: _params.has('demo'),
};

/* ================================================================
   STATE
   ================================================================ */
let state = {
  sessionToken: null,
  userId: null,
  displayName: null,
  conversationId: crypto.randomUUID(),
  portfolio: null,
  connected: false,
  messages: [],
};

/* ================================================================
   MOCK DATA — replace with real API calls when demoMode: false
   ================================================================ */
const MOCK = {
  portfolio: {
    totalValue: 84203,
    returnPct: 2.4,
    pnlToday: 312,
    cash: 6450,
    holdings: [
      { ticker: 'AAPL', name: 'Apple Inc.',    value: '$21,840', change: '▲ 1.8%', up: true  },
      { ticker: 'MSFT', name: 'Microsoft',     value: '$18,200', change: '▲ 3.1%', up: true  },
      { ticker: 'NVDA', name: 'NVIDIA Corp.',  value: '$14,960', change: '▼ 0.9%', up: false },
      { ticker: 'BRK.B',name: 'Berkshire B',   value: '$11,300', change: '▲ 0.4%', up: true  },
    ]
  },
  ai: {
    'show me my top holdings': null,   // handled specially
    'analyze my risk exposure': 'Your portfolio beta is **1.18** — roughly 18% more volatile than the S&P 500. Tech concentration sits at 62%, which is high. Consider diversifying into healthcare or dividend-paying equities to reduce sector risk.',
    'show rebalancing suggestions': 'You\'re **overweight Technology** (+12% vs target). I\'d suggest trimming ~$2,000 of NVDA and rotating into XLV (Healthcare ETF) or short-duration bonds to bring allocation back in line.',
    'recent transactions': null,        // card response
    'tax loss harvesting tips': 'You have **$1,840 in unrealized losses** across NVDA and META positions. Harvesting these before year-end could offset capital gains and save approximately **$441 in taxes** at a 24% rate.',
    'performance vs s&p 500': 'Year-to-date your portfolio is up **+11.2%** vs the S&P 500\'s **+9.8%**, an **alpha of +1.4%**. MSFT and AAPL are your primary outperformers.',
  },
  transactions: [
    { ticker: 'BUY  AAPL', name: 'May 27, 2026', value: '+15 shares', change: '$3,210',  up: false },
    { ticker: 'SELL TSLA', name: 'May 22, 2026', value: '−8 shares',  change: '$1,440',  up: true  },
    { ticker: 'DIV  MSFT', name: 'May 19, 2026', value: 'Dividend',   change: '+$48.20', up: true  },
  ]
};

/* ================================================================
   AUTH — swap CONFIG.demoMode = false to use real JWT flow
   ================================================================ */
async function authenticate() {
  if (CONFIG.demoMode) {
    await delay(600);
    state.sessionToken = 'demo-token-' + Date.now();
    state.userId = 'user_demo_alex';
    state.displayName = 'Alex';
    setStatus(true, 'Demo mode · mock data');
    return true;
  }

  const token = localStorage.getItem('access_token');
  if (!token) {
    setStatus(false, 'Sign in required');
    showToast('Sign in at ' + CONFIG.loginPage);
    return false;
  }

  try {
    const meRes = await fetch(CONFIG.authBase + CONFIG.meEndpoint, {
      headers: { Authorization: 'Bearer ' + token },
    });
    if (!meRes.ok) throw new Error('Session expired');
    const me = await meRes.json();
    state.sessionToken = token;
    state.userId = me.username;
    state.displayName = me.username.charAt(0).toUpperCase() + me.username.slice(1);
    setStatus(true, 'Connected · ' + me.username);
    return true;
  } catch (err) {
    localStorage.removeItem('access_token');
    localStorage.removeItem('refresh_token');
    setStatus(false, 'Session expired');
    showToast('Please sign in again.');
    return false;
  }
}

/* ================================================================
   PORTFOLIO — fetch from DB via your backend
   ================================================================ */
async function fetchPortfolio() {
  if (CONFIG.demoMode) {
    await delay(400);
    return MOCK.portfolio;
  }

  const res = await fetch(CONFIG.apiBase + CONFIG.portfolioEndpoint, {
    headers: { Authorization: 'Bearer ' + state.sessionToken },
  });
  if (!res.ok) throw new Error('Portfolio fetch failed');
  return await res.json();
}

function renderPortfolio(p) {
  document.getElementById('pTotal').textContent  = '$' + p.totalValue.toLocaleString();
  document.getElementById('pReturn').textContent  = (p.returnPct >= 0 ? '▲ ' : '▼ ') + Math.abs(p.returnPct).toFixed(1) + '%';
  document.getElementById('pReturn').className    = 'port-change ' + (p.returnPct >= 0 ? 'up' : 'down');
  document.getElementById('pPnl').textContent     = (p.pnlToday >= 0 ? '+$' : '-$') + Math.abs(p.pnlToday).toLocaleString();
  document.getElementById('pPnlLabel').className  = 'port-change ' + (p.pnlToday >= 0 ? 'up' : 'down');
  document.getElementById('pCash').textContent    = '$' + p.cash.toLocaleString();
  state.portfolio = p;
}

/* ================================================================
   AI CHAT — sends to your backend which calls Gemini API
   ================================================================ */
async function callChatAPI(userMessage) {
  if (CONFIG.demoMode) {
    await delay(800 + Math.random() * 600);
    return buildMockResponse(userMessage);
  }

  // Real call — your server proxies to Gemini and injects DB context
  const res = await fetch(CONFIG.apiBase + CONFIG.chatEndpoint, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: 'Bearer ' + state.sessionToken,
    },
    body: JSON.stringify({
      message: userMessage,
      conversationId: state.conversationId,
      userId: state.userId,
      // Your backend appends portfolio context before forwarding to Gemini
    }),
  });
  if (!res.ok) throw new Error('Chat API error');
  return await res.json(); // { text, card? }
}

function buildMockResponse(msg) {
  const key = msg.toLowerCase().trim();

  if (key.includes('holding') || key.includes('position')) {
    return { text: 'Here are your top 4 positions by current value:', card: state.portfolio?.holdings };
  }
  if (key.includes('transaction') || key.includes('recent')) {
    return { text: 'Your 3 most recent account transactions:', card: MOCK.transactions };
  }

  // Fuzzy match MOCK.ai keys
  for (const [k, v] of Object.entries(MOCK.ai)) {
    if (k && v && key.includes(k.split(' ')[0])) return { text: v };
  }

  return { text: 'I\'m pulling live data from your connected accounts. In production this response streams directly from Gemini with your real portfolio context injected server-side.' };
}

/* ================================================================
   UI HELPERS
   ================================================================ */
function addMessage(role, text, time, card) {
  const area = document.getElementById('messages');
  const isUser = role === 'user';
  state.messages.push({ role, text, time });

  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  let cardHTML = '';
  if (card && card.length) {
    cardHTML = '<div class="card-bubble">' + card.map(r => `
      <div class="card-row">
        <div><div class="card-ticker">${r.ticker}</div><div class="card-name">${r.name}</div></div>
        <div style="text-align:right">
          <div class="card-price">${r.value}</div>
          <div class="port-change ${r.up ? 'up' : 'down'}" style="font-size:11px">${r.change}</div>
        </div>
      </div>`).join('') + '</div>';
  }

  if (isUser) {
    wrap.innerHTML = `
      <div class="msg-avatar">AJ</div>
      <div><div class="msg-bubble">${escHtml(text)}</div><div class="msg-time">${time}</div></div>`;
  } else {
    wrap.innerHTML = `
      <div class="msg-avatar" aria-hidden="true">💹</div>
      <div>
        <div class="msg-bubble">${mdToHtml(text)}</div>
        ${cardHTML}
        <div class="msg-time">${time}</div>
      </div>`;
  }

  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;
}

function showTyping() {
  const area = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg bot'; div.id = 'typing';
  div.innerHTML = `<div class="msg-avatar" aria-hidden="true">💹</div>
    <div><div class="msg-bubble" style="padding:0">
      <div class="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div></div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function setStatus(ok, text) {
  state.connected = ok;
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusDot').style.background = ok ? '#5DCAA5' : '#F09595';
  document.getElementById('authBadge').textContent = ok ? '● Verified' : '● Disconnected';
  document.getElementById('authBadge').style.background = ok ? 'rgba(255,255,255,0.15)' : 'rgba(255,100,100,0.2)';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 3500);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function mdToHtml(s) {
  return escHtml(s)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/_(.*?)_/g, '<em>$1</em>');
}

function getTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ================================================================
   ACTIONS
   ================================================================ */
function sendQuick(btn, text) {
  btn.disabled = true;
  handleInput(text);
}

function handleSend() {
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  handleInput(text);
}

async function handleInput(text) {
  if (!state.connected) { showToast('Not connected — please wait…'); return; }
  addMessage('user', text, getTime());
  showTyping();

  try {
    const resp = await callChatAPI(text);
    hideTyping();
    addMessage('bot', resp.text, getTime(), resp.card);
  } catch (err) {
    hideTyping();
    addMessage('bot', 'Sorry, I couldn\'t reach the server. Please try again.', getTime());
  }
}

async function refreshPortfolio() {
  try {
    const p = await fetchPortfolio();
    renderPortfolio(p);
    showToast('Portfolio refreshed ✓');
  } catch { showToast('Could not refresh portfolio'); }
}

function toggleInfo() {
  addMessage('bot', 'I\'m a finance assistant connected to your brokerage database via a secure backend. All messages are encrypted in transit and your session token never leaves your browser. Powered by Google Gemini via your private API server.', getTime());
}

/* ================================================================
   BOOT
   ================================================================ */
async function boot() {
  document.getElementById('chatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSend();
  });

  const authed = await authenticate();
  if (!authed) return;

  try {
    const p = await fetchPortfolio();
    renderPortfolio(p);
  } catch { showToast('Could not load portfolio data'); }

  // Greeting message
  const name = state.displayName || 'there';
  addMessage('bot',
    `Hi ${name} 👋 I'm your finance assistant. Your portfolio is **${state.portfolio ? (state.portfolio.returnPct >= 0 ? 'up' : 'down') + ' ' + Math.abs(state.portfolio.returnPct) + '%' : 'loaded'}** today. What would you like to explore?`,
    getTime()
  );
}

boot();
</script>
</body>
</html>
